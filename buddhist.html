<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4efe6">
<title>디지털 목탁 | 마음쉼터</title>
<style>
:root{--ink:#30291f;--muted:#7b7062;--accent:#8b5e3c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at top,#fffaf0,#eee3d1 75%);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink)}
main{width:min(520px,100%);text-align:center}
.home{display:inline-block;margin-bottom:20px;color:#81684e;text-decoration:none;font-size:13px;font-weight:700}
h1{font-size:28px;margin:0 0 8px}p{color:var(--muted);line-height:1.8}
.panel{background:#fffdf8;border:1px solid #e6dccb;border-radius:30px;padding:clamp(24px,6vw,36px) 20px;box-shadow:0 20px 50px #5a46201a}
.moktak{width:180px;height:180px;max-width:60vw;max-height:60vw;border-radius:50%;border:0;background:radial-gradient(circle at 35% 28%,#c18a60,#77482a);color:#fff;font-size:20px;font-weight:800;cursor:pointer;box-shadow:0 14px 0 #5f3b22,0 24px 35px #5032144d;transition:transform .08s,box-shadow .08s;touch-action:manipulation}
.moktak:active{transform:translateY(9px);box-shadow:0 5px 0 #5f3b22,0 12px 20px #50321440}
.count{font-size:38px;font-weight:900;margin:25px 0 2px;color:var(--accent);font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--muted)}
.actions{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:22px}
button.reset{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px}
button.sound{border:1px solid #e4d8c7;border-radius:999px;background:#fffaf1;color:#66533d;padding:9px 13px;font-size:13px;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #b58b5d;outline-offset:4px}
</style>
</head>
<body>
<main>
<a class="home" href="index.html">← 마음쉼터 홈으로</a>
<h1>🪷 디지털 목탁</h1>
<p>마음이 복잡할수록 천천히 한 번씩.<br>편안한 자세로 호흡을 고르고 시작해 보세요.</p>
<section class="panel">
<button class="moktak" id="knock" type="button" aria-label="목탁 두드리기">목탁<br>두드리기</button>
<div class="count"><span id="count">0</span> 번</div>
<div class="small">누적 횟수 · 이 브라우저에 저장됩니다</div>
<div class="actions"><button class="sound" id="sound" type="button" aria-pressed="true">소리 켜짐</button><button class="reset" id="reset" type="button">기록 지우기</button></div>
</section>
</main>
<script>
const KEY='maeumshelter_moktak_count';
const countEl=document.getElementById('count');
const btn=document.getElementById('knock');
let count=0,audioCtx=null,soundOn=true;
try{count=Math.max(0,Number(localStorage.getItem(KEY))||0)}catch(e){}
function render(){countEl.textContent=count.toLocaleString('ko-KR')}
function playKnock(){
 if(!soundOn)return;
 try{
  audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='sine';o.frequency.setValueAtTime(185,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(82,audioCtx.currentTime+.11);
  g.gain.setValueAtTime(.13,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.16);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.17);
 }catch(e){}
}
btn.addEventListener('click',()=>{
 count++;try{localStorage.setItem(KEY,String(count))}catch(e){}
 render();playKnock();if(navigator.vibrate)navigator.vibrate(18);
});
document.getElementById('sound').addEventListener('click',function(){
 soundOn=!soundOn;this.textContent=soundOn?'소리 켜짐':'소리 꺼짐';this.setAttribute('aria-pressed',String(soundOn));
});
document.getElementById('reset').addEventListener('click',()=>{
 if(!confirm('목탁 횟수를 모두 지울까요?'))return;
 count=0;try{localStorage.setItem(KEY,'0')}catch(e){}render();
});
render();
</script>
</body>
</html>
